name: Apply looks and appeal scoring

on:
  push:
    branches: [looks-appeal-factor]
    paths:
      - .github/workflows/apply-looks-appeal.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: looks-appeal-factor
      - name: Add looks and appeal factor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Decision model: add a 12th research factor, defaulting to zero so
          # the published 100-point baseline is unchanged until the user opts in.
          replace_once(
              'lib/decision-model.ts',
              '  baselineComfortWeight: number;\n  baselinePracticalityWeight: number;',
              '  baselineComfortWeight: number;\n  baselineAppealWeight: number;\n  baselinePracticalityWeight: number;',
          )
          replace_once(
              'lib/decision-model.ts',
              '  baselineComfortWeight: 10,\n  baselinePracticalityWeight: 8,',
              '  baselineComfortWeight: 10,\n  baselineAppealWeight: 0,\n  baselinePracticalityWeight: 8,',
          )

          # Vehicle evidence: explicit subjective appeal score.
          replace_once(
              'lib/types.ts',
              '  comfortScore: number;\n  practicalityScore: number;',
              '  comfortScore: number;\n  appealScore: number;\n  practicalityScore: number;',
          )

          # Research scoring engine.
          replace_once(
              'lib/calculations.ts',
              '  comfort: number;\n  practicality: number;',
              '  comfort: number;\n  appeal: number;\n  practicality: number;',
          )
          replace_once(
              'lib/calculations.ts',
              '    comfort: vehicle.comfortScore,\n    practicality: vehicle.practicalityScore,',
              '    comfort: vehicle.comfortScore,\n    appeal: vehicle.appealScore,\n    practicality: vehicle.practicalityScore,',
          )
          replace_once(
              'lib/calculations.ts',
              '    comfort: Math.max(0, model.baselineComfortWeight),\n    practicality: Math.max(0, model.baselinePracticalityWeight),',
              '    comfort: Math.max(0, model.baselineComfortWeight),\n    appeal: Math.max(0, model.baselineAppealWeight),\n    practicality: Math.max(0, model.baselinePracticalityWeight),',
          )
          replace_once(
              'lib/calculations.ts',
              '    + (factors.comfort * weights.comfort)\n    + (factors.practicality * weights.practicality)',
              '    + (factors.comfort * weights.comfort)\n    + (factors.appeal * weights.appeal)\n    + (factors.practicality * weights.practicality)',
          )
          replace_once(
              'lib/calculations.ts',
              '// 20/20/15/10/10/8/7/4/3/2/1 research weights. Editing the weights then',
              '// 20/20/15/10/10/8/7/4/3/2/1 research weights, with looks/appeal at 0. Editing the weights then',
          )

          # Seed transparent starting appeal scores. These are editable by the
          # user in Build your decision and are deliberately not treated as facts.
          data_path = Path('data/vehicle-data.json')
          data = json.loads(data_path.read_text())
          starting_scores = {
              'kia-ev3-air-long-range': 88,
              'toyota-chr-plus-design': 86,
              'renault-scenic-techno-lr': 90,
              'skoda-elroq-85-se': 84,
              'hyundai-kona-electric-65': 82,
              'toyota-rav4-phev-icon': 78,
              'ford-kuga-phev-stline': 81,
              'mg-hs-phev-trophy': 83,
          }
          for vehicle in data['vehicles']:
              vehicle['appealScore'] = starting_scores[vehicle['id']]
          data_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # UI: expose the factor and let the user rate every car's looks.
          replace_once(
              'components/decision-app.tsx',
              'const MODEL_STORAGE_KEY = "carwise-decision-model-v1";',
              'const MODEL_STORAGE_KEY = "carwise-decision-model-v1";\nconst APPEAL_STORAGE_KEY = "carwise-appeal-scores-v1";',
          )
          replace_once(
              'components/decision-app.tsx',
              '  { key: "baselineComfortWeight", label: "Comfort / quality", original: 10 },\n  { key: "baselinePracticalityWeight", label: "Practicality", original: 8 },',
              '  { key: "baselineComfortWeight", label: "Comfort / quality", original: 10 },\n  { key: "baselineAppealWeight", label: "Looks / appeal", original: 0 },\n  { key: "baselinePracticalityWeight", label: "Practicality", original: 8 },',
          )
          replace_once(
              'components/decision-app.tsx',
              '  const [decisionModel, setDecisionModel] = useState<DecisionModel>(defaultDecisionModel);\n  const [modelLoaded, setModelLoaded] = useState(false);',
              '  const [decisionModel, setDecisionModel] = useState<DecisionModel>(defaultDecisionModel);\n  const [modelLoaded, setModelLoaded] = useState(false);\n  const [appealScores, setAppealScores] = useState<Record<string, number>>(() => Object.fromEntries(vehicles.map((vehicle) => [vehicle.id, vehicle.appealScore])));\n  const [appealLoaded, setAppealLoaded] = useState(false);',
          )
          replace_once(
              'components/decision-app.tsx',
              '  useEffect(() => {\n    if (!modelLoaded) return;\n    window.localStorage.setItem(MODEL_STORAGE_KEY, JSON.stringify(decisionModel));\n  }, [decisionModel, modelLoaded]);\n\n  const liveVehicles = useMemo(() => {',
              '  useEffect(() => {\n    if (!modelLoaded) return;\n    window.localStorage.setItem(MODEL_STORAGE_KEY, JSON.stringify(decisionModel));\n  }, [decisionModel, modelLoaded]);\n\n  useEffect(() => {\n    try {\n      const stored = window.localStorage.getItem(APPEAL_STORAGE_KEY);\n      if (stored) {\n        const parsed = JSON.parse(stored) as Record<string, number>;\n        setAppealScores((current) => ({ ...current, ...parsed }));\n      }\n    } catch {\n      // Keep the transparent starting ratings if saved preferences are malformed.\n    } finally {\n      setAppealLoaded(true);\n    }\n  }, []);\n\n  useEffect(() => {\n    if (!appealLoaded) return;\n    window.localStorage.setItem(APPEAL_STORAGE_KEY, JSON.stringify(appealScores));\n  }, [appealScores, appealLoaded]);\n\n  const liveVehicles = useMemo(() => {',
          )
          replace_once(
              'components/decision-app.tsx',
              '        nearlyNewPrice: observation?.observedUsedMedian ?? vehicle.nearlyNewPrice,\n        taxAnnual: annualTax,',
              '        nearlyNewPrice: observation?.observedUsedMedian ?? vehicle.nearlyNewPrice,\n        appealScore: appealScores[vehicle.id] ?? vehicle.appealScore,\n        taxAnnual: annualTax,',
          )
          replace_once(
              'components/decision-app.tsx',
              '  }, [live]);',
              '  }, [live, appealScores]);',
          )
          replace_once(
              'components/decision-app.tsx',
              '  const modelChangeCount = (Object.keys(defaultDecisionModel) as Array<keyof DecisionModel>)\n    .filter((key) => decisionModel[key] !== defaultDecisionModel[key]).length;',
              '  const modelChangeCount = (Object.keys(defaultDecisionModel) as Array<keyof DecisionModel>)\n    .filter((key) => decisionModel[key] !== defaultDecisionModel[key]).length;\n  const appealChangeCount = vehicles.filter((vehicle) => (appealScores[vehicle.id] ?? vehicle.appealScore) !== vehicle.appealScore).length;',
          )
          replace_once(
              'components/decision-app.tsx',
              '  const changeDecisionModel = <K extends keyof DecisionModel>(key: K, value: DecisionModel[K]) => {\n    setDecisionModel((current) => ({ ...current, [key]: value }));\n  };',
              '  const changeDecisionModel = <K extends keyof DecisionModel>(key: K, value: DecisionModel[K]) => {\n    setDecisionModel((current) => ({ ...current, [key]: value }));\n  };\n\n  const changeAppealScore = (vehicleId: string, value: number) => {\n    setAppealScores((current) => ({ ...current, [vehicleId]: Math.max(0, Math.min(100, value)) }));\n  };\n\n  const resetAppealScores = () => {\n    setAppealScores(Object.fromEntries(vehicles.map((vehicle) => [vehicle.id, vehicle.appealScore])));\n  };',
          )
          replace_once(
              'components/decision-app.tsx',
              '                    <Metric label="Parking score" value={`${vehicle.parkingScore}/100`} />',
              '                    <Metric label="Parking score" value={`${vehicle.parkingScore}/100`} />\n                    <Metric label="Looks / appeal" value={`${vehicle.appealScore}/100`} />',
          )
          replace_once(
              'components/decision-app.tsx',
              '<p>The original study uses 20 + 20 + 15 + 10 + 10 + 8 + 7 + 4 + 3 + 2 + 1 = 100. Change any number to build your own formula.</p>',
              '<p>The original study still totals 100 points. Looks / appeal is now available as an extra subjective factor and starts at 0 points so the published baseline is unchanged until you choose to use it.</p>',
          )
          replace_once(
              'components/decision-app.tsx',
              '            </div>\n\n            <div className="section-head model-section-head">\n              <div><p className="eyebrow">Step 3 · How should CarWise decide?</p>',
              '''            </div>\n\n            <div className="baseline-editor-card">\n              <div className="baseline-editor-top">\n                <div>\n                  <h2>Rate the looks yourself</h2>\n                  <p>Looks are personal. These are starting scores only; change them to match your own taste. They affect the ranking only when you give Looks / appeal some of your 100 decision points.</p>\n                </div>\n                <div className="baseline-total">\n                  <strong>{appealChangeCount}</strong>\n                  <span>ratings changed</span>\n                  <small>{appealLoaded ? "Saved in this browser" : "Loading saved ratings"}</small>\n                </div>\n              </div>\n              <div className="baseline-point-grid">\n                {vehicles.map((vehicle) => (\n                  <label className="baseline-point-row" key={`appeal-${vehicle.id}`}>\n                    <span className="baseline-point-copy">\n                      <strong>{vehicle.brand} {vehicle.model}</strong>\n                      <small>{vehicle.trim} · starting score {vehicle.appealScore}/100</small>\n                    </span>\n                    <span className="baseline-point-input">\n                      <input\n                        type="number"\n                        inputMode="numeric"\n                        min={0}\n                        max={100}\n                        step={1}\n                        value={appealScores[vehicle.id] ?? vehicle.appealScore}\n                        onFocus={(event) => event.currentTarget.select()}\n                        onClick={(event) => event.currentTarget.select()}\n                        onChange={(event) => {\n                          const cleaned = event.currentTarget.value.replace(/^0+(?=\\d)/, "");\n                          if (cleaned !== event.currentTarget.value) event.currentTarget.value = cleaned;\n                          changeAppealScore(vehicle.id, Number(cleaned) || 0);\n                        }}\n                        aria-label={`${vehicle.brand} ${vehicle.model} looks and appeal rating`}\n                      />\n                      <b>/100</b>\n                    </span>\n                  </label>\n                ))}\n              </div>\n              <div className="baseline-editor-actions">\n                <button className="secondary-button" onClick={resetAppealScores}><RefreshCcw size={16} /> Reset looks ratings</button>\n              </div>\n            </div>\n\n            <div className="section-head model-section-head">\n              <div><p className="eyebrow">Step 3 · How should CarWise decide?</p>''',
          )
          replace_once(
              'components/decision-app.tsx',
              '{modelChangeCount > 0 || profileChangeCount > 0 ? "Your custom formula is active" : "Original CarWise formula"}',
              '{modelChangeCount > 0 || profileChangeCount > 0 || appealChangeCount > 0 ? "Your custom formula is active" : "Original CarWise formula"}',
          )
          replace_once(
              'components/decision-app.tsx',
              'className={classNames("profile-active", (modelChangeCount > 0 || profileChangeCount > 0) && "changed")}',
              'className={classNames("profile-active", (modelChangeCount > 0 || profileChangeCount > 0 || appealChangeCount > 0) && "changed")}',
          )
          replace_once(
              'components/decision-app.tsx',
              '<article className="method-card"><span>02</span><h3>Configure the research baseline</h3><p>All 11 original 100-point study factors are editable. The active weights are normalised automatically to 100.</p></article>',
              '<article className="method-card"><span>02</span><h3>Configure the research baseline</h3><p>The 11 original study factors remain editable, with Looks / appeal added as a 12th subjective factor. It starts at 0 points so the published 100-point benchmark is preserved.</p></article>',
          )
          replace_once(
              'components/decision-app.tsx',
              '<div className="callout"><Info size={18} /><div><strong>Resetting the Decision model restores the published study.</strong><p>The original 20/20/15/10/10/8/7/4/3/2/1 weighting reproduces the stored research scores exactly; the configurable layer then lets you test alternative research priorities without losing the original benchmark.</p></div></div>',
              '<div className="callout"><Info size={18} /><div><strong>Resetting the Decision model restores the published study.</strong><p>The original 20/20/15/10/10/8/7/4/3/2/1 weighting still reproduces the stored research scores exactly. Looks / appeal defaults to 0 points and only changes the result when you choose to allocate points to it.</p></div></div>',
          )
          PY
      - name: Remove helper workflow
        run: rm .github/workflows/apply-looks-appeal.yml
      - name: Commit change
        run: |
          git config user.name "carwise-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/decision-app.tsx lib/decision-model.ts lib/calculations.ts lib/types.ts data/vehicle-data.json .github/workflows/apply-looks-appeal.yml
          git commit -m "feat: add configurable looks and appeal rating"
          git push origin HEAD:looks-appeal-factor