name: Fix zero point input

on:
  push:
    branches: [fix-zero-point-input]
    paths:
      - .github/workflows/fix-zero-point-input.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-zero-point-input
      - name: Patch point input behaviour
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/decision-app.tsx')
          text = path.read_text()
          old = '''                          value={decisionModel[item.key]}\n                          onChange={(event) => changeDecisionModel(item.key, Math.max(0, Math.min(100, Number(event.target.value) || 0)))}\n                          aria-label={`${item.label} research points`}\n'''
          new = '''                          value={decisionModel[item.key]}\n                          onFocus={(event) => event.currentTarget.select()}\n                          onClick={(event) => event.currentTarget.select()}\n                          onChange={(event) => {\n                            const cleaned = event.currentTarget.value.replace(/^0+(?=\\d)/, \"\");\n                            if (cleaned !== event.currentTarget.value) event.currentTarget.value = cleaned;\n                            changeDecisionModel(item.key, Math.max(0, Math.min(100, Number(cleaned) || 0)));\n                          }}\n                          aria-label={`${item.label} research points`}\n'''
          if old not in text:
              raise SystemExit('target point input block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-zero-point-input.yml
          git config user.name "carwise-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/decision-app.tsx .github/workflows/fix-zero-point-input.yml
          git commit -m "fix: replace leading zero in point inputs"
          git push origin HEAD:fix-zero-point-input
