name: Apply menu order change
on:
  push:
    branches: [menu-build-first]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: menu-build-first
      - name: Move Build your decision to top
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/decision-app.tsx')
          s = p.read_text()
          old = '''const nav: { id: View; label: string; icon: typeof LayoutDashboard }[] = [
            { id: "dashboard", label: "Decision", icon: LayoutDashboard },
            { id: "compare", label: "Compare", icon: GitCompareArrows },
            { id: "deals", label: "Deals", icon: BadgePoundSterling },
            { id: "profile", label: "Build your decision", icon: SlidersHorizontal },
            { id: "data", label: "Data monitor", icon: Database },
            { id: "methodology", label: "Method", icon: Info },
          ];'''.replace('          ', '')
          new = '''const nav: { id: View; label: string; icon: typeof LayoutDashboard }[] = [
            { id: "profile", label: "Build your decision", icon: SlidersHorizontal },
            { id: "dashboard", label: "Decision", icon: LayoutDashboard },
            { id: "compare", label: "Compare", icon: GitCompareArrows },
            { id: "deals", label: "Deals", icon: BadgePoundSterling },
            { id: "data", label: "Data monitor", icon: Database },
            { id: "methodology", label: "Method", icon: Info },
          ];'''.replace('          ', '')
          if old not in s:
              raise SystemExit('nav block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove helper workflow
        run: rm .github/workflows/apply-menu-order.yml
      - name: Commit change
        run: |
          git config user.name "carwise-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/decision-app.tsx .github/workflows/apply-menu-order.yml
          git commit -m "feat: move Build your decision to top of menu"
          git push origin HEAD:menu-build-first
