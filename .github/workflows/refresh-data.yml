name: Refresh research sources

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run refresh:data
      - name: Commit source observations
        run: |
          if git diff --quiet; then
            echo "No source metadata changes."
            exit 0
          fi
          git config user.name "carwise-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vehicle-data.json
          git commit -m "chore(data): refresh monitored research sources"
          git push
