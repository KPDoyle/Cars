name: Clarify baseline editor

on:
  push:
    branches: [baseline-ui-clarity]
    paths:
      - .github/workflows/clarify-baseline-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baseline-ui-clarity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch baseline editor
        env:
          PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import os, base64, gzip
          data = gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64'])).decode()
          exec(compile(data, '<patch>', 'exec'))
          PY
          rm .github/workflows/clarify-baseline-ui.yml
          git config user.name "carwise-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/decision-app.tsx app/globals.css .github/workflows/clarify-baseline-ui.yml
          git commit -m "feat: make 100-point baseline editor explicit"
          git push origin HEAD:baseline-ui-clarity
